name: dev-ci-cd
 
# on:
#   push:
#     branches:
#       - development
#       - main
on:
    workflow_dispatch:
 
jobs:
  ci:
    runs-on: ubuntu-latest
 
    strategy:
      matrix:
        node-version: [20.16.0]
 
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
 
      # 2. Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
 
      # 3. Install dependencies
      - name: Install dependencies
        run: yarn install
 
      # 4. Lint code
      # - name: Run ESLint
      #   run: yarn lint
 
      # 5. Build TypeScript
      - name: Build project
        run: yarn build
 
      # 6. Docker steps (only for main branch)
      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
       # 7. Build Docker image
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t devcdgodhani/vittaiq-api-dev:latest .
          docker tag devcdgodhani/vittaiq-api-dev:latest devcdgodhani/vittaiq-api-dev:${GITHUB_SHA::8}
 
       # 8. Push Docker image
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push devcdgodhani/vittaiq-api-dev:latest
          docker push devcdgodhani/vittaiq-api-dev:${GITHUB_SHA::8}

       # 9. Deploy to EC2 via SSH
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # script: |
          #   cd ~/vittaiq
          #   docker compose pull
          #   docker compose down
          #   docker compose up -d 
          #   docker system prune -af
          script: |
            cd ~/vittaiq
            docker compose pull
            docker compose up -d --no-deps --build app
            docker system prune -af
